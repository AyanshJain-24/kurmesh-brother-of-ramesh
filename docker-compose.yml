name: kurmesh

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
    - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AUTH_SECRET: ${AUTH_SECRET}
      KURMESH_DEMO_SEED: ${KURMESH_DEMO_SEED:-false}
      KURMESH_DEMO_EMAIL: ${KURMESH_DEMO_EMAIL:-}
      KURMESH_DEMO_PASSWORD: ${KURMESH_DEMO_PASSWORD:-}
      KURMESH_DEMO_FULL_NAME: ${KURMESH_DEMO_FULL_NAME:-KURMESH Demo User}
      KURMESH_DEMO_ICEBERG_MODEL_ARTIFACT_PATH: ${KURMESH_DEMO_ICEBERG_MODEL_ARTIFACT_PATH:-}
      KURMESH_ENVIRONMENT_PROVIDERS: ${KURMESH_ENVIRONMENT_PROVIDERS:-}
      KURMESH_ENVIRONMENT_PROVIDER_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_TIMEOUT_SECONDS:-15}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENABLED: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENABLED:-false}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENDPOINT: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENDPOINT:-}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_TIMEOUT_SECONDS:-30}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_FRESHNESS_HOURS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_FRESHNESS_HOURS:-48}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_LOOKBACK_DAYS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_LOOKBACK_DAYS:-3}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_MAX_FALLBACK_DISTANCE_KM: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_MAX_FALLBACK_DISTANCE_KM:-75}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENABLED: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENABLED:-false}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENDPOINT: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENDPOINT:-https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_TIMEOUT_SECONDS:-30}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_FRESHNESS_HOURS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_FRESHNESS_HOURS:-6}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_MAX_FALLBACK_DISTANCE_KM: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_MAX_FALLBACK_DISTANCE_KM:-75}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENABLED: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENABLED:-false}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENDPOINT: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENDPOINT:-}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_TIMEOUT_SECONDS:-60}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_FRESHNESS_HOURS: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_FRESHNESS_HOURS:-24}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_MAX_FALLBACK_DISTANCE_KM: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_MAX_FALLBACK_DISTANCE_KM:-75}
      COPERNICUSMARINE_SERVICE_USERNAME: ${COPERNICUSMARINE_SERVICE_USERNAME:-}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${COPERNICUSMARINE_SERVICE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KURMESH_ENVIRONMENT_PROVIDERS: ${KURMESH_ENVIRONMENT_PROVIDERS:-}
      KURMESH_ENVIRONMENT_PROVIDER_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_TIMEOUT_SECONDS:-15}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENABLED: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENABLED:-false}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENDPOINT: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_ENDPOINT:-}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_TIMEOUT_SECONDS:-30}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_FRESHNESS_HOURS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_FRESHNESS_HOURS:-48}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_LOOKBACK_DAYS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_LOOKBACK_DAYS:-3}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_MAX_FALLBACK_DISTANCE_KM: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_NSIDC_G10016_MAX_FALLBACK_DISTANCE_KM:-75}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENABLED: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENABLED:-false}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENDPOINT: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_ENDPOINT:-https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_TIMEOUT_SECONDS:-30}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_FRESHNESS_HOURS: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_FRESHNESS_HOURS:-6}
      KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_MAX_FALLBACK_DISTANCE_KM: ${KURMESH_ENVIRONMENT_PROVIDER_NOAA_GFS_MAX_FALLBACK_DISTANCE_KM:-75}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENABLED: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENABLED:-false}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENDPOINT: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_ENDPOINT:-}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_TIMEOUT_SECONDS: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_TIMEOUT_SECONDS:-60}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_FRESHNESS_HOURS: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_FRESHNESS_HOURS:-24}
      KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_MAX_FALLBACK_DISTANCE_KM: ${KURMESH_ENVIRONMENT_PROVIDER_COPERNICUS_MARINE_OCEAN_MAX_FALLBACK_DISTANCE_KM:-75}
      COPERNICUSMARINE_SERVICE_USERNAME: ${COPERNICUSMARINE_SERVICE_USERNAME:-}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${COPERNICUSMARINE_SERVICE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
